services:
  # ════════════════════════════════════════════
  #  PostgreSQL instances (one per service)
  # ════════════════════════════════════════════
  postgres-patients:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PATIENTS_DB}
    volumes:
      - patients-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PATIENTS_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - clinic-network

  postgres-appointments:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${APPOINTMENTS_DB}
    volumes:
      - appointments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${APPOINTMENTS_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - clinic-network

  postgres-treatment:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TREATMENT_DB}
    volumes:
      - treatment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TREATMENT_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - clinic-network

  postgres-billing:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${BILLING_DB}
    volumes:
      - billing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${BILLING_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - clinic-network

  # ════════════════════════════════════════════
  #  Redis (shared cache)
  # ════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - clinic-network

  # ════════════════════════════════════════════
  #  FastAPI microservices
  # ════════════════════════════════════════════
  patient-service:
    build:
      context: ./patient-service
    env_file:
      - ./patient-service/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres-patients:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-network

  appointment-service:
    build:
      context: ./appointment-service
    env_file:
      - ./appointment-service/.env
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres-appointments:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-network

  treatment-service:
    build:
      context: ./treatment-service
    env_file:
      - ./treatment-service/.env
    depends_on:
      postgres-treatment:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-network

  billing-service:
    build:
      context: ./billing-service
    env_file:
      - ./billing-service/.env
    depends_on:
      postgres-billing:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-network

  # ════════════════════════════════════════════
  #  Nginx API Gateway
  # ════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - patient-service
      - appointment-service
      - treatment-service
      - billing-service
    restart: unless-stopped
    networks:
      - clinic-network

volumes:
  patients-data:
  appointments-data:
  treatment-data:
  billing-data:

networks:
  clinic-network:
    driver: bridge
