# ════════════════════════════════════════════
#  Nginx API Gateway + ConfigMap
# ════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    upstream patient_service {
        server patient-service:8001;
    }

    upstream appointment_service {
        server appointment-service:8002;
    }

    upstream treatment_service {
        server treatment-service:8003;
    }

    upstream billing_service {
        server billing-service:8004;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # ── Patient Service ──
        location /api/patients {
            proxy_pass http://patient_service;
        }

        location /api/doctors {
            proxy_pass http://patient_service;
        }

        location ~ ^/(docs|openapi|redoc)/patients {
            proxy_pass http://patient_service;
        }

        # ── Appointment Service ──
        location /api/visits {
            proxy_pass http://appointment_service;
        }

        location ~ ^/(docs|openapi|redoc)/appointments {
            proxy_pass http://appointment_service;
        }

        # ── Treatment Service ──
        location /api/diagnoses {
            proxy_pass http://treatment_service;
        }

        location /api/prescriptions {
            proxy_pass http://treatment_service;
        }

        location /api/treatment-history {
            proxy_pass http://treatment_service;
        }

        location ~ ^/(docs|openapi|redoc)/treatments {
            proxy_pass http://treatment_service;
        }

        # ── Billing Service ──
        location /api/payments {
            proxy_pass http://billing_service;
        }

        location ~ ^/(docs|openapi|redoc)/billing {
            proxy_pass http://billing_service;
        }

        # ── Health endpoint ──
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
