# ════════════════════════════════════════════
#  Treatment Service (FastAPI)
# ════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treatment-service
  labels:
    app: treatment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: treatment-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: treatment-service
    spec:
      containers:
        - name: treatment-service
          image: treatment-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          env:
            - name: SERVICE_NAME
              value: "treatment-service"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://clinic_user:clinic_password@postgres-treatment:5432/clinic_treatment"
            - name: APPOINTMENT_SERVICE_URL
              value: "http://appointment-service:8002"
---
apiVersion: v1
kind: Service
metadata:
  name: treatment-service
spec:
  selector:
    app: treatment-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
